<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">身体系统关系示意图</title>
  <desc id="desc">以抽象方式表示感觉、荷尔蒙与生殖系统相互影响，不代表个体诊断。</desc>
  <rect width="800" height="480" rx="28" fill="#fff8ef" />
  <text x="48" y="56" fill="#c38a29" font-size="18" font-weight="700" letter-spacing="3">BODY LITERACY</text>
  <text x="48" y="94" fill="#242321" font-size="30" font-weight="800">身体不是一台单一功能的机器</text>
  <g transform="translate(400 276)">
    <circle cx="0" cy="-118" r="34" fill="#f1c9a5" />
    <path d="M-62-66c-30 40-42 92-30 148 12 52 30 84 30 84h124s18-32 30-84c12-56 0-108-30-148-30 18-94 18-124 0z" fill="#f6d7b8" />
    <path d="M-100 176h200" stroke="#d95f4e" stroke-width="6" stroke-linecap="round" />
    <circle cx="-30" cy="86" r="32" fill="#d95f4e" opacity=".7" />
    <circle cx="30" cy="86" r="32" fill="#2c8c82" opacity=".7" />
    <circle cx="0" cy="22" r="26" fill="#7a63a8" opacity=".7" />
    <text x="-30" y="93" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">感觉</text>
    <text x="30" y="93" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">激素</text>
    <text x="0" y="29" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">周期</text>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" fill="#45413d" font-size="16">
    <path d="M160 180h150" stroke="#d95f4e" stroke-width="3" /><text x="160" y="164">疼痛、愉悦与安全感受</text>
    <path d="M490 180h150" stroke="#2c8c82" stroke-width="3" /><text x="490" y="164">压力、睡眠、药物</text>
    <path d="M160 380h150" stroke="#7a63a8" stroke-width="3" /><text x="160" y="364">生殖与内分泌系统</text>
    <path d="M490 380h150" stroke="#c38a29" stroke-width="3" /><text x="490" y="364">个体差异与就医信号</text>
  </g>
</svg>
