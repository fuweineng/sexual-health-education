<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">误区核验清单</title>
  <desc id="desc">问号与勾选符号组成的原创科普阅读方法示意图。</desc>
  <rect width="800" height="480" rx="28" fill="#fff6f0" />
  <text x="48" y="56" fill="#d95f4e" font-size="18" font-weight="700" letter-spacing="3">MYTH CHECK</text>
  <text x="48" y="94" fill="#242321" font-size="30" font-weight="800">先问来源，再转发</text>
  <circle cx="210" cy="280" r="86" fill="#f5c6bb" />
  <text x="210" y="322" text-anchor="middle" fill="#a84437" font-size="112" font-weight="800">?</text>
  <g font-family="Microsoft YaHei, sans-serif" fill="#45413d" font-size="18">
    <rect x="360" y="172" width="340" height="54" rx="14" fill="#fff" stroke="#f0d4cc" /><text x="392" y="206">① 结论来自哪类来源？</text>
    <rect x="360" y="250" width="340" height="54" rx="14" fill="#fff" stroke="#f0d4cc" /><text x="392" y="284">② 是研究，还是个人经历？</text>
    <rect x="360" y="328" width="340" height="54" rx="14" fill="#fff" stroke="#f0d4cc" /><text x="392" y="362">③ 是否省略了适用边界？</text>
  </g>
  <path d="M300 176l18 18 34-38" fill="none" stroke="#2c8c82" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
