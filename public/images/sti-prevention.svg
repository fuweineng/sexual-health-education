<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">性传播感染预防三层图</title>
  <desc id="desc">疫苗、安全套和检测共同构成预防性传播感染的三层工具。</desc>
  <rect width="800" height="480" rx="28" fill="#f7f2fb" />
  <text x="48" y="56" fill="#7a63a8" font-size="18" font-weight="700" letter-spacing="3">PREVENTION STACK</text>
  <text x="48" y="94" fill="#242321" font-size="30" font-weight="800">预防不是单选题</text>
  <g transform="translate(400 268)">
    <path d="M0-150l128 46v88c0 82-56 132-128 164C-72 116-128 66-128-16v-88z" fill="#7a63a8" opacity=".16" />
    <path d="M0-126l106 38v72c0 68-46 110-106 138C-60 94-106 52-106-16v-72z" fill="#2c8c82" opacity=".22" />
    <path d="M0-100l84 30v54c0 54-36 88-84 110C-48 72-84 38-84-16v-54z" fill="#d95f4e" opacity=".22" />
    <text x="0" y="-30" text-anchor="middle" fill="#242321" font-size="20" font-weight="700">疫苗</text>
    <text x="0" y="8" text-anchor="middle" fill="#242321" font-size="20" font-weight="700">安全套</text>
    <text x="0" y="46" text-anchor="middle" fill="#242321" font-size="20" font-weight="700">检测</text>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" fill="#45413d" font-size="16">
    <circle cx="86" cy="180" r="7" fill="#d95f4e" /><text x="104" y="186">可预防的感染先咨询疫苗</text>
    <circle cx="86" cy="264" r="7" fill="#2c8c82" /><text x="104" y="270">安全套降低多种风险</text>
    <circle cx="86" cy="348" r="7" fill="#7a63a8" /><text x="104" y="354">没有症状也要按需检测</text>
  </g>
</svg>
