<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">性取向与关系光谱示意</title>
  <desc id="desc">用横向光谱表示性取向和关系偏好存在多种可能，不应被单一标签定义。</desc>
  <rect width="800" height="480" rx="28" fill="#f8f4fb" />
  <text x="48" y="56" fill="#7a63a8" font-size="18" font-weight="700" letter-spacing="3">MANY WAYS TO LOVE</text>
  <text x="48" y="94" fill="#242321" font-size="30" font-weight="800">不要用单一标签定义一个人</text>
  <rect x="90" y="250" width="620" height="20" rx="10" fill="url(#spectrum)" />
  <defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a63a8" /><stop offset=".5" stop-color="#d95f4e" /><stop offset="1" stop-color="#2c8c82" /></linearGradient></defs>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <circle cx="120" cy="260" r="28" fill="#fff" stroke="#7a63a8" stroke-width="5" /><text x="120" y="330" fill="#242321" font-size="18" font-weight="700">一种吸引</text>
    <circle cx="400" cy="260" r="28" fill="#fff" stroke="#d95f4e" stroke-width="5" /><text x="400" y="330" fill="#242321" font-size="18" font-weight="700">多种吸引</text>
    <circle cx="680" cy="260" r="28" fill="#fff" stroke="#2c8c82" stroke-width="5" /><text x="680" y="330" fill="#242321" font-size="18" font-weight="700">流动与变化</text>
  </g>
  <rect x="90" y="386" width="620" height="52" rx="16" fill="#fff" stroke="#dfd0ee" />
  <text x="400" y="418" text-anchor="middle" fill="#6a4d8e" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">自我认同可以长期探索，也可以在不同阶段发生变化</text>
</svg>
