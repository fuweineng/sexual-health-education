<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">持续沟通循环</title>
  <desc id="desc">询问、确认、尊重三个步骤组成的持续沟通循环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#d95f4e" />
    </marker>
  </defs>
  <rect width="800" height="480" rx="28" fill="#fff8f4" />
  <text x="48" y="56" fill="#a84437" font-size="18" font-weight="700" letter-spacing="3">COMMUNICATION LOOP</text>
  <text x="48" y="94" fill="#242321" font-size="30" font-weight="800">同意不是一次性的“开关”</text>
  <circle cx="400" cy="260" r="76" fill="#d95f4e" />
  <text x="400" y="252" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">持续</text>
  <text x="400" y="281" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">沟通</text>
  <circle cx="150" cy="180" r="58" fill="#2c8c82" />
  <text x="150" y="188" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">询问</text>
  <circle cx="650" cy="180" r="58" fill="#7a63a8" />
  <text x="650" y="188" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">确认</text>
  <circle cx="400" cy="408" r="58" fill="#c38a29" />
  <text x="400" y="416" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">尊重</text>
  <path d="M206 200C270 260 300 250 330 254" fill="none" stroke="#d95f4e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M470 254C520 250 560 230 592 200" fill="none" stroke="#d95f4e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M640 238C620 320 530 350 458 372" fill="none" stroke="#d95f4e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M342 372C270 350 180 320 160 238" fill="none" stroke="#d95f4e" stroke-width="4" marker-end="url(#arrow)" />
  <text x="400" y="462" text-anchor="middle" fill="#6d6862" font-size="16">开始前 · 进行中 · 结束后，都可以重新确认</text>
</svg>
