<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">紧急避孕时间线</title>
  <desc id="desc">展示无保护性行为后越早咨询越方便，选择需按时间和当地服务确认。</desc>
  <rect width="800" height="480" rx="28" fill="#fff9ee" />
  <text x="48" y="56" fill="#c38a29" font-size="18" font-weight="700" letter-spacing="3">TIME MATTERS</text>
  <text x="48" y="94" fill="#242321" font-size="30" font-weight="800">越早行动，选择通常越多</text>
  <path d="M80 270H720" stroke="#c38a29" stroke-width="6" stroke-linecap="round" />
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <circle cx="130" cy="270" r="22" fill="#c38a29" /><text x="130" y="232" fill="#242321" font-size="19" font-weight="700">现在</text><text x="130" y="320" fill="#6d6862" font-size="14">咨询药师或医生</text>
    <circle cx="320" cy="270" r="22" fill="#d95f4e" /><text x="320" y="232" fill="#242321" font-size="19" font-weight="700">几小时内</text><text x="320" y="320" fill="#6d6862" font-size="14">部分方法更可行</text>
    <circle cx="520" cy="270" r="22" fill="#7a63a8" /><text x="520" y="232" fill="#242321" font-size="19" font-weight="700">当天/次日</text><text x="520" y="320" fill="#6d6862" font-size="14">尽快获得专业建议</text>
    <circle cx="700" cy="270" r="22" fill="#2c8c82" /><text x="700" y="232" fill="#242321" font-size="19" font-weight="700">之后</text><text x="700" y="320" fill="#6d6862" font-size="14">仍可做妊娠检测与随访</text>
  </g>
  <rect x="80" y="386" width="640" height="52" rx="16" fill="#fff" stroke="#f1d8a4" />
  <text x="400" y="418" text-anchor="middle" fill="#8a6118" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">紧急避孕不是长期避孕方案，具体选择取决于时间、体重、既往用药和当地服务</text>
</svg>
